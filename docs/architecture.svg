<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%" style="background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="1">CYBERRANGER ARCHITECTURE FLOW</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">Defensive Security Co-Evolution Loop • Contained Local Research Lab</text>

  <!-- RED GENERATOR AGENT CONTAINER -->
  <rect x="50" y="110" width="300" height="370" rx="12" fill="url(#purpleGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="70" y="140" fill="#c084fc" font-size="14" font-weight="bold" letter-spacing="0.5">RED TEST GENERATOR</text>
  
  <rect x="70" y="160" width="260" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="200" y="188" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">UCB1 Operator Bandit</text>

  <rect x="70" y="225" width="260" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="200" y="250" text-anchor="middle" fill="#c7d2fe" font-size="11">BNF Grammar Mutation (4 Classes)</text>

  <rect x="70" y="280" width="260" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="200" y="305" text-anchor="middle" fill="#c7d2fe" font-size="11">Genetic Crossover (AST Subtrees)</text>

  <rect x="70" y="335" width="260" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4"/>
  <text x="200" y="360" text-anchor="middle" fill="#c7d2fe" font-size="11">Combinatorial Transforms (URL/Hex/Case)</text>

  <rect x="70" y="390" width="260" height="65" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.6"/>
  <text x="200" y="415" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">MAP-Elites Novelty Archive</text>
  <text x="200" y="435" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">Niche: (Class x Inj x Evas x Outcome)</text>

  <!-- CONTAINMENT GUARD & TARGET -->
  <rect x="420" y="110" width="260" height="70" rx="10" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="550" y="138" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">NETWORK GUARD</text>
  <text x="550" y="158" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="monospace">127.0.0.1:8080 Containment</text>

  <rect x="420" y="230" width="260" height="75" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="550" y="258" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">LOCAL TARGET (DVWA)</text>
  <text x="550" y="278" text-anchor="middle" fill="#94a3b8" font-size="11">Docker (OrbStack amd64 emulation)</text>
  <text x="550" y="293" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">SQLi • XSS • CMDi • File Inclusion</text>

  <!-- REFEREE ENGINE -->
  <rect x="420" y="360" width="260" height="120" rx="10" fill="url(#cyanGrad)" stroke="#06b6d4" stroke-width="2"/>
  <text x="550" y="390" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="bold">REFEREE ENGINE</text>
  <text x="550" y="415" text-anchor="middle" fill="#e2e8f0" font-size="11">Independent Dual-Signal Scoring</text>
  <text x="550" y="435" text-anchor="middle" fill="#94a3b8" font-size="10">Target Compromised (0/1) vs Detection (0/1)</text>
  <text x="550" y="455" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="monospace">Fitness = 0.5*Comp + 0.3*Evad + 0.2*Nov</text>

  <!-- BLUE DETECTION AGENT CONTAINER -->
  <rect x="750" y="110" width="300" height="370" rx="12" fill="url(#emeraldGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="770" y="140" fill="#34d399" font-size="14" font-weight="bold" letter-spacing="0.5">BLUE DETECTION AGENT</text>

  <rect x="770" y="160" width="260" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="900" y="185" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Explainable Rule Engine</text>
  <text x="900" y="205" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">12 Structural Rules + Reasons</text>

  <rect x="770" y="235" width="260" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="900" y="258" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">14-D Feature Extractor</text>
  <text x="900" y="274" text-anchor="middle" fill="#6ee7b7" font-size="9" font-family="monospace">Entropy, Special Chars, Keywords</text>

  <rect x="770" y="300" width="260" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-opacity="0.6"/>
  <text x="900" y="325" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Random Forest Classifier</text>
  <text x="900" y="345" text-anchor="middle" fill="#34d399" font-size="10" font-family="monospace">50 Estimators • Versioned Snapshots</text>

  <rect x="770" y="380" width="260" height="80" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.6"/>
  <text x="900" y="405" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">Human-in-the-Loop Triage</text>
  <text x="900" y="425" text-anchor="middle" fill="#94a3b8" font-size="10">Review: Confirmed / Rejected / Duplicate</text>
  <text x="900" y="443" text-anchor="middle" fill="#fcd34d" font-size="9" font-family="monospace">Only Confirmed Labels Train Model</text>

  <!-- BOTTOM PANELS: DASHBOARD & STORAGE -->
  <rect x="50" y="530" width="630" height="150" rx="12" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="75" y="565" fill="#22d3ee" font-size="14" font-weight="bold">LIVE REACT 19 RESEARCH DASHBOARD (SSE STREAM)</text>
  <text x="75" y="595" fill="#e2e8f0" font-size="11">• 4 Metric Cards: Detection Rate, Evasion Rate, Compromises, Active Rules</text>
  <text x="75" y="618" fill="#e2e8f0" font-size="11">• Dual Live Charts: Co-Evolutionary Arms Race &amp; Retrain Learning Curve</text>
  <text x="75" y="641" fill="#e2e8f0" font-size="11">• Interactive Controls: Step, Autonomous Run, Pause, Seed Selector, Triage</text>
  <text x="75" y="664" fill="#94a3b8" font-size="10" font-family="monospace">• Real-Time Server-Sent Events (SSE) Stream @ /api/events/{exp_id}</text>

  <rect x="710" y="530" width="340" height="150" rx="12" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
  <text x="730" y="565" fill="#cbd5e1" font-size="14" font-weight="bold">PERSISTENCE &amp; REGRESSION</text>
  <text x="730" y="595" fill="#94a3b8" font-size="11">• SQLite DB: Experiments, Rounds, Reviews</text>
  <text x="730" y="620" fill="#94a3b8" font-size="11">• Regression Archive: Snapshot Replay Pass</text>
  <text x="730" y="645" fill="#94a3b8" font-size="11">• Re-evaluates blue models vs historical red</text>
  <text x="730" y="665" fill="#38bdf8" font-size="10" font-family="monospace">Zero Fabricated Numbers • Complete Audit Trail</text>

  <!-- ARROWS / CONNECTORS -->
  <!-- Generator to Guard -->
  <line x1="350" y1="145" x2="415" y2="145" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- Guard to DVWA -->
  <line x1="550" y1="180" x2="550" y2="225" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- DVWA to Referee -->
  <line x1="550" y1="305" x2="550" y2="355" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- Referee to Detection Agent -->
  <line x1="680" y1="390" x2="745" y2="390" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <!-- Detection Agent to Triage -->
  <line x1="900" y1="460" x2="900" y2="520" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Referee to Dashboard -->
  <line x1="480" y1="480" x2="480" y2="525" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- Referee to Bandit (Reward Feedback) -->
  <path d="M 420 440 L 380 440 L 380 185 L 335 185" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowPurple)"/>
</svg>
